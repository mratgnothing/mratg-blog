<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="t d"><title id="t">12 张 RF 图像子集审计统计</title><desc id="d">train 6 张、valid 3 张、test 3 张；Bluetooth 25 个标注，WiFi 19 个标注，共 44 个。版本登记 3 类，样本实际出现 2 类。无训练和准确率结果。</desc><rect width="1000" height="570" fill="#fff6e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#332d39"><text x="48" y="62" font-size="30" font-weight="700">12 张真实样本，44 个原始标注</text><text x="48" y="100" font-size="18">数据统计图 · 来自已验证样本与标签，非模型性能图</text><g font-size="22"><text x="48" y="163">图像划分（张）</text><text x="48" y="205">train</text><text x="48" y="259">valid</text><text x="48" y="313">test</text><text x="535" y="163">标注类别（个）</text><text x="535" y="205">Bluetooth</text><text x="535" y="259">WiFi</text></g><g stroke="#332d39" stroke-width="2"><rect x="145" y="181" width="270" height="34" fill="#65b9a5"/><rect x="145" y="235" width="135" height="34" fill="#e9b95f"/><rect x="145" y="289" width="135" height="34" fill="#bc8fc5"/><rect x="675" y="181" width="225" height="34" fill="#65b9a5"/><rect x="675" y="235" width="171" height="34" fill="#e9b95f"/></g><g font-size="22" font-weight="700"><text x="430" y="207">6</text><text x="295" y="261">3</text><text x="295" y="315">3</text><text x="915" y="207">25</text><text x="862" y="261">19</text></g><rect x="48" y="370" width="904" height="100" fill="#fff" stroke="#332d39" stroke-width="2"/><text x="70" y="411" font-size="22" font-weight="700">版本登记 3 类 / 此子集实际出现 2 类</text><text x="70" y="447" font-size="18">这不能推断完整数据集缺少第三类，也不能推断任何检测准确率。</text><text x="48" y="517" font-size="17">来源：Mendeley Data · DOI 10.17632/y4w96kzsb5.1 · CC BY 4.0</text><text x="48" y="547" font-size="17">仅进行数据审计；未训练、未测量 mAP、未租用 GPU。</text></g></svg>